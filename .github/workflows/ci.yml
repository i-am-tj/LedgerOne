name: Required checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: ledgerone
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ledgerone_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerone -d ledgerone_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ledgerone:ci-only-password@127.0.0.1:5432/ledgerone_test?schema=public
      TEST_DATABASE_URL: postgresql://ledgerone:ci-only-password@127.0.0.1:5432/ledgerone_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: python3 scripts/check_foundation.py
