name: ledgerone
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.development.example to .env.development.local first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
      POSTGRES_DB: ${POSTGRES_DB:?Set a local database name}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ledgerone_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  ledgerone_postgres:
